# Builds the keystub binary for each platform when a v* tag is pushed and
# publishes them as a GitHub release, which install.sh downloads from.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test ./...
      - name: Build
        env:
          CGO_ENABLED: "0"
          VERSION: ${{ github.ref_name }}
        run: |
          set -eu
          mkdir -p dist
          for target in darwin/arm64 darwin/amd64 linux/amd64 linux/arm64 windows/amd64 windows/arm64; do
            os=${target%/*}; arch=${target#*/}
            dir="build/keystub_${os}_${arch}"; mkdir -p "$dir"
            bin=keystub; [ "$os" = windows ] && bin=keystub.exe
            GOOS=$os GOARCH=$arch go build -trimpath -ldflags "-s -w -X main.version=$VERSION" -o "$dir/$bin" ./cmd/keystub
            cp LICENSE NOTICE README.md "$dir/"
            if [ "$os" = windows ]; then
              (cd build && zip -qr "../dist/keystub_${os}_${arch}.zip" "keystub_${os}_${arch}")
            else
              tar -C build -czf "dist/keystub_${os}_${arch}.tar.gz" "keystub_${os}_${arch}"
            fi
          done
          (cd dist && sha256sum * > checksums.txt)
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" dist/* --title "${{ github.ref_name }}" --generate-notes
