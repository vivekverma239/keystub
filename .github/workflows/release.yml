# Builds the keystub binary for each platform when a v* tag is pushed and
# publishes them as a GitHub release, which install.sh downloads from, and
# as npm packages (keystub plus @keystub/cli-<os>-<cpu>) when the NPM_TOKEN
# secret is set.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test ./...
      - name: Build
        env:
          CGO_ENABLED: "0"
          VERSION: ${{ github.ref_name }}
        run: |
          set -eu
          mkdir -p dist
          for target in darwin/arm64 darwin/amd64 linux/amd64 linux/arm64 windows/amd64 windows/arm64; do
            os=${target%/*}; arch=${target#*/}
            dir="build/keystub_${os}_${arch}"; mkdir -p "$dir"
            bin=keystub; [ "$os" = windows ] && bin=keystub.exe
            GOOS=$os GOARCH=$arch go build -trimpath -ldflags "-s -w -X main.version=$VERSION" -o "$dir/$bin" ./cmd/keystub
            cp LICENSE NOTICE README.md "$dir/"
            if [ "$os" = windows ]; then
              (cd build && zip -qr "../dist/keystub_${os}_${arch}.zip" "keystub_${os}_${arch}")
            else
              tar -C build -czf "dist/keystub_${os}_${arch}.tar.gz" "keystub_${os}_${arch}"
            fi
          done
          (cd dist && sha256sum * > checksums.txt)
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Lay out and try the npm packages
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          set -eu
          npm/build.sh "$VERSION" build npm-dist
          mkdir -p npm-try && cd npm-try && npm init -y >/dev/null
          (cd ../npm-dist/cli-linux-x64 && npm pack --pack-destination ../../npm-try)
          (cd ../npm-dist/keystub && npm pack --pack-destination ../../npm-try)
          npm install ./*.tgz
          npx keystub version | grep -F "$VERSION"
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" dist/* --title "${{ github.ref_name }}" --generate-notes
      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -eu
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::notice::NPM_TOKEN isn't set, so nothing went to npm"
            exit 0
          fi
          # Platform packages first, so keystub never points at one missing.
          # One already there (a rerun) is left as it is.
          for dir in npm-dist/cli-* npm-dist/keystub; do
            spec=$(node -p "const p = require('./$dir/package.json'); p.name + '@' + p.version")
            if npm view "$spec" version >/dev/null 2>&1; then
              echo "$spec is already on npm"
              continue
            fi
            (cd "$dir" && npm publish --provenance --access public)
          done
